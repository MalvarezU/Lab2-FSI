<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Evaluación de Aerolínea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .form-container {
            max-width: 550px;
            margin: auto;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: block;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Evaluación de Aerolínea</h2>
    <form th:action="@{/airline/evaluate}" th:object="${airlineRequest}" method="post">
        <h3>Datos del Pasajero</h3>
        <label for="name">Nombre:</label>
        <input type="text" id="name" th:field="${airlineRequest.passenger.name}">
        <span class="error" th:errors="${airlineRequest.passenger.name}"></span>

        <label for="age">Edad:</label>
        <input type="number" id="age" th:field="${airlineRequest.passenger.age}">
        <span class="error" th:errors="${airlineRequest.passenger.age}"></span>

        <label for="membershipTier">Membresía:</label>
        <select id="membershipTier" th:field="${airlineRequest.passenger.membershipTier}">
            <option value="">Seleccione</option>
            <option value="Basic">Basic</option>
            <option value="Silver">Silver</option>
            <option value="Gold">Gold</option>
            <option value="Platinum">Platinum</option>
        </select>
        <span class="error" th:errors="${airlineRequest.passenger.membershipTier}"></span>

        <label for="travellingWithChildren">¿Viaja con niños?</label>
        <select id="travellingWithChildren" th:field="${airlineRequest.passenger.travellingWithChildren}">
            <option value="false">No</option>
            <option value="true">Sí</option>
        </select>

        <h3>Datos del Vuelo</h3>
        <label for="flightNumber">Número de vuelo:</label>
        <input type="text" id="flightNumber" th:field="${airlineRequest.flight.flightNumber}">
        <span class="error" th:errors="${airlineRequest.flight.flightNumber}"></span>

        <label for="delayMinutes">Retraso (minutos):</label>
        <input type="number" id="delayMinutes" th:field="${airlineRequest.flight.delayMinutes}" step="1">
        <span class="error" th:errors="${airlineRequest.flight.delayMinutes}"></span>

        <label for="durationHours">Duración (horas):</label>
        <input type="number" id="durationHours" th:field="${airlineRequest.flight.durationHours}" step="0.5">
        <span class="error" th:errors="${airlineRequest.flight.durationHours}"></span>

        <label for="emergencyExitSeatsAvailable">Asientos de emergencia disponibles:</label>
        <input type="number" id="emergencyExitSeatsAvailable"
               th:field="${airlineRequest.flight.emergencyExitSeatsAvailable}" step="1">
        <span class="error" th:errors="${airlineRequest.flight.emergencyExitSeatsAvailable}"></span>

        <h3>Datos de la Solicitud</h3>
        <label for="luggageWeightKg">Peso del equipaje (kg):</label>
        <input type="number" id="luggageWeightKg" th:field="${airlineRequest.luggageWeightKg}" step="0.1">
        <span class="error" th:errors="${airlineRequest.luggageWeightKg}"></span>

        <label for="seatPreference">Preferencia de asiento:</label>
        <select id="seatPreference" th:field="${airlineRequest.seatPreference}">
            <option value="">Seleccione</option>
            <option value="Any">Sin preferencia (Any)</option>
            <option value="Window">Ventana (Window)</option>
            <option value="Aisle">Pasillo (Aisle)</option>
        </select>
        <span class="error" th:errors="${airlineRequest.seatPreference}"></span>

        <label for="basePrice">Precio base del pasaje ($):</label>
        <input type="number" id="basePrice" th:field="${airlineRequest.basePrice}" step="0.01">
        <span class="error" th:errors="${airlineRequest.basePrice}"></span>

        <button type="submit">Evaluar</button>
    </form>
</div>
</body>
</html>
